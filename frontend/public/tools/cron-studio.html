<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cron Studio</title>
<style>
:root{
  --paper:#eef1f4;
  --surface:#ffffff;
  --sunken:#e4e9ee;
  --ink:#16202a;
  --ink-soft:#5b6b7a;
  --line:#c8d2db;
  --line-soft:#dde4ea;
  --accent:#1f4ed8;
  --accent-ink:#ffffff;
  --danger:#c0392b;
  --warn:#a86400;
  --ok:#2e7d32;
  --fill-alpha:0.16;
  color-scheme:light dark;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0f151b;
    --surface:#161f27;
    --sunken:#111920;
    --ink:#e4ebf1;
    --ink-soft:#8ea0b0;
    --line:#2b3945;
    --line-soft:#212c36;
    --accent:#6d8dff;
    --accent-ink:#0f151b;
    --danger:#e57373;
    --warn:#e0a84a;
    --ok:#6cc070;
    --fill-alpha:0.30;
  }
}
:root[data-theme="dark"]{
  --paper:#0f151b;
  --surface:#161f27;
  --sunken:#111920;
  --ink:#e4ebf1;
  --ink-soft:#8ea0b0;
  --line:#2b3945;
  --line-soft:#212c36;
  --accent:#6d8dff;
  --accent-ink:#0f151b;
  --danger:#e57373;
  --warn:#e0a84a;
  --ok:#6cc070;
  --fill-alpha:0.30;
}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.mono,code,pre{font-family:"IBM Plex Mono",ui-monospace,monospace}

.bar{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
.brand{font-weight:600;margin:0;font-size:15px}
.brand span{color:var(--ink-soft);font-weight:400}

.wrap{display:grid;gap:12px;padding:12px;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,1fr);align-items:start}
@media (max-width:1180px){.wrap{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.col-out{grid-column:1/-1}}
@media (max-width:760px){.wrap{grid-template-columns:minmax(0,1fr);padding:8px;gap:8px}}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}

.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;min-width:0}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 10px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
.card-head h2{margin:0;font-size:13px;font-weight:600}
.card-body{padding:10px}
.muted{color:var(--ink-soft)}
.small{font-size:12px}

.expr-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.expr{flex:1 1 220px;min-width:0;padding:7px 9px;font-size:18px;letter-spacing:.04em;border:1px solid var(--line);border-radius:5px;background:var(--sunken);font-family:"IBM Plex Mono",ui-monospace,monospace}
.expr.bad{border-color:var(--danger)}
select,.inp{padding:4px 6px;border:1px solid var(--line);border-radius:4px;background:var(--sunken);font-size:13px;max-width:100%}
.tzsel{flex:0 1 230px;min-width:0}
.err{color:var(--danger);margin:6px 0 0;font-size:12px}
.desc{margin:8px 0 0;font-size:15px;font-weight:500}
.desc.empty{font-weight:400;color:var(--ink-soft);font-size:13px}

.strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin-top:10px}
.cell{border:1px solid var(--line-soft);border-radius:4px;padding:4px 6px;background:var(--paper);cursor:pointer;text-align:left;min-width:0}
.cell:hover{border-color:var(--ink-soft)}
.cell[aria-selected="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.cell b{display:block;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell small{display:block;color:var(--ink-soft);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.presets{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.chip{padding:3px 8px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;font-size:12px}
.chip:hover{border-color:var(--ink-soft)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.btn{padding:4px 10px;border:1px solid var(--line);border-radius:5px;background:var(--surface);cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--ink-soft)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line-soft);padding:6px 8px 0}
.tab{padding:5px 9px;border:1px solid transparent;border-bottom:none;border-radius:5px 5px 0 0;background:none;cursor:pointer;font-size:12px;color:var(--ink-soft);margin-bottom:-1px}
.tab[aria-selected="true"]{background:var(--surface);border-color:var(--line-soft);color:var(--ink);font-weight:600}

.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.seg button{border:none;border-right:1px solid var(--line);background:var(--surface);padding:4px 9px;cursor:pointer;font-size:12px}
.seg button:last-child{border-right:none}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

.grid{display:grid;gap:3px;margin-top:10px}
.g60{grid-template-columns:repeat(12,minmax(0,1fr))}
.g24{grid-template-columns:repeat(12,minmax(0,1fr))}
.g31{grid-template-columns:repeat(7,minmax(0,1fr))}
.g12{grid-template-columns:repeat(6,minmax(0,1fr))}
.g7{grid-template-columns:repeat(7,minmax(0,1fr))}
@media (max-width:420px){.g12{grid-template-columns:repeat(4,minmax(0,1fr))}}
.v{padding:4px 0;border:1px solid var(--line-soft);border-radius:3px;background:var(--paper);cursor:pointer;font-size:12px;font-family:"IBM Plex Mono",ui-monospace,monospace;min-width:0;overflow:hidden}
.v.name{font-family:inherit}
.v:hover{border-color:var(--ink-soft)}
.v[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.form{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.form label{display:flex;gap:6px;align-items:center;color:var(--ink-soft)}
.hint{color:var(--ink-soft);font-size:12px;margin:8px 0 0}

.runs{list-style:none;margin:0;padding:0}
.run{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:2px 8px;padding:5px 10px;border-bottom:1px solid var(--line-soft);align-items:baseline}
.run:last-child{border-bottom:none}
.run .n{color:var(--ink-soft);font-size:11px;font-family:"IBM Plex Mono",ui-monospace,monospace}
.run .when{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:13px;min-width:0}
.run .rel{color:var(--ink-soft);font-size:12px;text-align:right;white-space:nowrap}
.run .utc{grid-column:2/-1;color:var(--ink-soft);font-size:12px;font-family:"IBM Plex Mono",ui-monospace,monospace}
.run.gap .when{text-decoration:line-through;color:var(--ink-soft)}
.tag{display:inline-block;font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:11px;padding:0 5px;border-radius:3px;border:1px solid var(--warn);color:var(--warn);margin-left:6px;vertical-align:1px}
.empty{padding:14px 10px;color:var(--ink-soft);margin:0}

.checks{list-style:none;margin:0;padding:6px 10px;display:flex;flex-direction:column;gap:6px}
.checks li{padding-left:14px;position:relative}
.checks li::before{content:"";position:absolute;left:0;top:6px;width:7px;height:7px;border-radius:50%;background:var(--ink-soft)}
.checks li.danger::before{background:var(--danger)}
.checks li.warn::before{background:var(--warn)}
.checks li.ok::before{background:var(--ok)}
.checks h3{margin:4px 0 0;font-size:12px;font-weight:600;color:var(--ink-soft)}
.checks li.h{padding-left:0}.checks li.h::before{display:none}

.out{margin:0;padding:10px;white-space:pre-wrap;word-break:break-word;font-size:12px;line-height:1.5;background:var(--sunken);max-height:560px;overflow:auto;border-bottom:1px solid var(--line-soft)}
.out-foot{display:flex;gap:10px;align-items:center;padding:8px 10px;flex-wrap:wrap}
.count{color:var(--ink-soft);font-size:12px;font-family:"IBM Plex Mono",ui-monospace,monospace}
.copied{color:var(--ok);font-size:12px}
.btn:disabled{opacity:.6;cursor:default}
.btn:disabled:hover{border-color:var(--line)}

/* second opinion (croniter), only when served with /api */
.ck{padding:8px 10px 10px;border-top:1px solid var(--line-soft);font-size:12px}
.ck.stale .ck-body{opacity:.55}
.ck-head{margin:0;font-weight:600;font-size:13px}
.ck-head.ok{color:var(--ok)}
.ck-head.warn{color:var(--warn)}
.ck-head.danger{color:var(--danger)}
.ck-note{margin:3px 0 0;color:var(--ink-soft)}
.ck-list{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.ck-list li{padding-left:14px;position:relative}
.ck-list li::before{content:"";position:absolute;left:0;top:5px;width:7px;height:7px;border-radius:50%;background:var(--ink-soft)}
.ck-list li.warn::before{background:var(--warn)}
.ck-list li.danger::before{background:var(--danger)}
.ck-when{font-family:"IBM Plex Mono",ui-monospace,monospace}
.ck-why{display:block;color:var(--ink-soft);margin-top:1px}
.ck-link{background:none;border:none;padding:0;color:inherit;font:inherit;cursor:pointer;text-align:left;text-decoration:underline dotted;text-underline-offset:2px}
.ck-link:hover{color:var(--accent)}
.ck details{margin-top:6px}
.ck summary{cursor:pointer;color:var(--ink-soft)}
.ck table{border-collapse:collapse;margin-top:4px;width:100%;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px}
.ck th,.ck td{text-align:left;padding:2px 6px 2px 0;border-bottom:1px solid var(--line-soft);white-space:nowrap}
.ck th{font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-weight:600;color:var(--ink-soft)}
.ck td.x{color:var(--danger)}
.ck-tw{overflow-x:auto}
</style>
</head>
<body>

<header class="bar">
  <h1 class="brand">Cron Studio <span>— build, check and preview cron schedules</span></h1>
</header>

<main class="wrap">
  <div class="col">
    <section class="card">
      <div class="card-body">
        <div class="expr-row">
          <input id="expr" class="expr" type="text" spellcheck="false" autocomplete="off" aria-label="Cron expression" placeholder="*/15 9-17 * * 1-5">
          <select id="tz" class="tzsel" aria-label="Time zone"></select>
        </div>
        <p class="err" id="err" hidden></p>
        <p class="desc empty" id="desc">Type a 5-field cron expression (minute hour day-of-month month day-of-week), pick a template below, or build it field by field.</p>
        <div class="strip" id="strip" role="tablist" aria-label="Fields"></div>
        <div class="presets" id="presets" aria-label="Templates"></div>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2 id="bTitle">Minute</h2>
        <div class="seg" id="modes" aria-label="Selection mode"></div>
      </div>
      <div class="card-body" id="builder"></div>
    </section>
  </div>

  <div class="col">
    <section class="card">
      <div class="card-head">
        <h2>Next 10 runs</h2>
        <span class="muted small" id="runsTz"></span>
      </div>
      <ol class="runs" id="runs"></ol>
    </section>
    <section class="card">
      <div class="card-head"><h2>Checks</h2><span class="muted small" id="checkCount"></span></div>
      <ul class="checks" id="checks"></ul>
    </section>
  </div>

  <div class="col col-out">
    <section class="card">
      <div class="tabs" role="tablist" id="otabs">
        <button class="tab" role="tab" data-fmt="cron">Cron</button>
        <button class="tab" role="tab" data-fmt="prompt">Prompt</button>
        <button class="tab" role="tab" data-fmt="code">Code</button>
      </div>
      <pre class="out" id="out" tabindex="0"></pre>
      <div class="out-foot">
        <button class="btn btn-primary" id="copy">Copy</button>
        <button class="btn" id="ckBtn" type="button" hidden title="Ask croniter for the next 10 runs and compare them with this page's list">Check</button>
        <span class="count" id="ocount"></span>
        <span class="copied" id="copied" aria-live="polite"></span>
      </div>
      <div class="ck" id="ck" hidden aria-live="polite"></div>
    </section>
  </div>
</main>

<script>
(function(){
"use strict";

/* ==CORE START== (pure scheduling logic; no DOM) */
var MONTH_NAMES=["January","February","March","April","May","June","July","August","September","October","November","December"];
var MONTH_ABBR=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
var DAY_NAMES=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
var DAY_ABBR=["SUN","MON","TUE","WED","THU","FRI","SAT"];
var FIELD_SPECS=[
  {key:"minute",label:"Minute",short:"Minute",min:0,max:59},
  {key:"hour",label:"Hour",short:"Hour",min:0,max:23},
  {key:"dom",label:"Day of month",short:"Day",min:1,max:31},
  {key:"month",label:"Month",short:"Month",min:1,max:12,names:MONTH_ABBR,nameBase:1},
  {key:"dow",label:"Day of week",short:"Weekday",min:0,max:7,names:DAY_ABBR,nameBase:0}
];
var MACROS={"@yearly":"0 0 1 1 *","@annually":"0 0 1 1 *","@monthly":"0 0 1 * *","@weekly":"0 0 * * 0","@daily":"0 0 * * *","@midnight":"0 0 * * *","@hourly":"0 * * * *"};

function CronError(field,msg){ this.field=field; this.message=msg; }

function pad2(n){ return (n<10?"0":"")+n; }
function hm(h,m){ return pad2(h)+":"+pad2(m); }
function ordinal(n){ var s=["th","st","nd","rd"], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }
function joinList(a){ return a.length<2 ? a.join("") : a.slice(0,-1).join(", ")+" and "+a[a.length-1]; }
function runsOf(vals){ var r=[]; vals.forEach(function(v){ var l=r[r.length-1]; if(l&&v===l[1]+1) l[1]=v; else r.push([v,v]); }); return r; }

function parseValue(tok,spec){
  var t=tok.toUpperCase();
  if(spec.names){ var i=spec.names.indexOf(t); if(i>=0) return i+spec.nameBase; }
  if(!/^\d+$/.test(t)){
    throw new CronError(spec.key, spec.label+': "'+tok+'" is not a value. Use '+spec.min+"–"+spec.max+(spec.names?" or "+spec.names[0]+"–"+spec.names[spec.names.length-1]:"")+".");
  }
  var v=parseInt(t,10);
  if(v<spec.min||v>spec.max) throw new CronError(spec.key, spec.label+" "+v+" is out of range. Allowed: "+spec.min+"–"+spec.max+(spec.key==="dow"?" (0 and 7 are Sunday)":"")+".");
  return v;
}

function parseField(raw,spec){
  if(raw==="?"&&(spec.key==="dom"||spec.key==="dow")) raw="*";
  var set=[]; for(var i=0;i<=spec.max;i++) set.push(false);
  raw.split(",").forEach(function(it){
    if(it==="") throw new CronError(spec.key, spec.label+': empty item in "'+raw+'". Remove the extra comma.');
    var sl=it.split("/");
    if(sl.length>2) throw new CronError(spec.key, spec.label+': "'+it+'" has more than one "/".');
    var step=1;
    if(sl.length===2){
      if(!/^\d+$/.test(sl[1])||+sl[1]<1) throw new CronError(spec.key, spec.label+': step "/'+sl[1]+'" must be a whole number of 1 or more.');
      step=+sl[1];
    }
    var base=sl[0], lo, hi;
    if(base==="*"){ lo=spec.min; hi=spec.max; }
    else if(base.indexOf("-")>=0){
      var p=base.split("-");
      if(p.length!==2||p[0]===""||p[1]==="") throw new CronError(spec.key, spec.label+': range "'+base+'" must look like 1-5.');
      lo=parseValue(p[0],spec); hi=parseValue(p[1],spec);
      if(lo>hi) throw new CronError(spec.key, spec.label+': range "'+base+'" runs backwards. Split it, e.g. "'+p[0]+"-"+(spec.names?spec.names[spec.names.length-1]:spec.max)+","+(spec.names?spec.names[0]:spec.min)+"-"+p[1]+'".');
    } else if(base===""){
      throw new CronError(spec.key, spec.label+': "'+it+'" is missing a value before "/".');
    } else { lo=parseValue(base,spec); hi=sl.length===2?spec.max:lo; }
    for(var v=lo;v<=hi;v+=step) set[v]=true;
  });
  if(spec.key==="dow"){ if(set[7]) set[0]=true; set.length=7; }
  var values=[]; set.forEach(function(b,v){ if(b) values.push(v); });
  var full=values.length===(spec.key==="dow"?7:spec.max-spec.min+1);
  return {raw:raw, set:set, values:values, star:raw.charAt(0)==="*", full:full};
}

function parseCron(input){
  var s=String(input||"").trim().replace(/\s+/g," ");
  if(s==="") throw new CronError(null,"Empty expression.");
  var macro=null;
  if(s.charAt(0)==="@"){
    var k=s.toLowerCase();
    if(k==="@reboot") throw new CronError(null,"@reboot runs once at boot, not on a schedule, so there is nothing to preview.");
    if(!MACROS[k]) throw new CronError(null,'Unknown macro "'+s+'". Known: '+Object.keys(MACROS).join(", ")+".");
    macro=k; s=MACROS[k];
  }
  var parts=s.split(" ");
  if(parts.length!==5){
    var hint=parts.length===6?" Six fields looks like Quartz/Spring (seconds first): drop the seconds field.":parts.length===7?" Seven fields looks like Quartz with seconds and year: drop the first and last field.":"";
    throw new CronError(null,"Expected 5 fields (minute hour day-of-month month day-of-week), got "+parts.length+"."+hint);
  }
  var f=parts.map(function(p,i){ return parseField(p,FIELD_SPECS[i]); });
  return {expr:parts.join(" "), macro:macro, minute:f[0], hour:f[1], dom:f[2], month:f[3], dow:f[4], fields:f};
}

function dayMatches(c,y,m,d){
  if(!c.month.set[m]) return false;
  var wd=new Date(Date.UTC(y,m-1,d)).getUTCDay();
  var a=c.dom.set[d], b=c.dow.set[wd];
  /* Vixie/cronie: if either day field starts with "*", both must match (AND); otherwise either (OR). */
  if(c.dom.star||c.dow.star) return a&&b;
  return a||b;
}
function daysInMonth(y,m){ return new Date(Date.UTC(y,m,0)).getUTCDate(); }
function wallMatches(c,W){
  var d=new Date(W);
  return c.minute.set[d.getUTCMinutes()]&&c.hour.set[d.getUTCHours()]&&dayMatches(c,d.getUTCFullYear(),d.getUTCMonth()+1,d.getUTCDate());
}
/* Calls fn(W) for every matching naive wall-clock time (ms, UTC fields = wall fields) at or after fromW. */
function forEachWallMatch(c,fromW,maxDays,fn){
  var s=new Date(fromW), h0=s.getUTCHours(), m0=s.getUTCMinutes();
  var day=Date.UTC(s.getUTCFullYear(),s.getUTCMonth(),s.getUTCDate());
  for(var i=0;i<maxDays;i++,day+=864e5){
    var d=new Date(day);
    if(d.getUTCDate()>daysInMonth(d.getUTCFullYear(),d.getUTCMonth()+1)) continue;
    if(!dayMatches(c,d.getUTCFullYear(),d.getUTCMonth()+1,d.getUTCDate())) continue;
    for(var hi=0;hi<c.hour.values.length;hi++){
      var h=c.hour.values[hi]; if(i===0&&h<h0) continue;
      for(var mi=0;mi<c.minute.values.length;mi++){
        var m=c.minute.values[mi]; if(i===0&&h===h0&&m<m0) continue;
        if(fn(day+h*36e5+m*6e4)===false) return;
      }
    }
  }
}

var dtfCache={};
function zoneDTF(tz){
  if(!dtfCache[tz]) dtfCache[tz]=new Intl.DateTimeFormat("en-US",{timeZone:tz,hourCycle:"h23",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit"});
  return dtfCache[tz];
}
function isValidZone(tz){ try{ zoneDTF(tz); return true; }catch(e){ return false; } }
/* Wall clock of instant t in tz, returned as naive ms. */
function wallMs(tz,t){
  var p={}; zoneDTF(tz).formatToParts(new Date(t)).forEach(function(x){ p[x.type]=x.value; });
  var h=+p.hour; if(h===24) h=0;
  return Date.UTC(+p.year,+p.month-1,+p.day,h,+p.minute,+p.second);
}
function offsetMin(tz,t){ var tt=Math.floor(t/1000)*1000; return Math.round((wallMs(tz,tt)-tt)/6e4); }
/* Instants (sorted) at which the wall clock in tz reads W. [] = inside a DST gap; 2 items = repeated hour. */
function wallToInstants(tz,W){
  var before=offsetMin(tz,W-864e5), after=offsetMin(tz,W+864e5), out=[];
  [before,after].forEach(function(o){ var t=W-o*6e4; if(out.indexOf(t)<0&&wallMs(tz,t)===W) out.push(t); });
  out.sort(function(a,b){ return a-b; });
  return {instants:out, before:before, after:after};
}
/* Next `count` runs strictly after fromMs. Skipped (DST gap) wall times are included as {gap:true} but not counted. */
function nextRuns(c,tz,fromMs,count,maxDays){

  if(!r){ box.hidden=true; box.innerHTML=""; return; }
  var stale=ck.key!==ckKey(), tz=r.tz;
  var h='<p class="ck-head '+r.level+'">'+esc(r.head)+(stale?'<span class="tag">outdated</span>':"")+"</p>";
  if(stale) h+='<p class="ck-note">The expression or time zone changed since this check. Press Check again.</p>';
  h+='<div class="ck-body">';
  var items=[], rules=[];
  (r.errors||[]).forEach(function(m){
    var needle=r.expr&&outHas(r.expr)?r.expr:"";
    items.push('<li class="danger">'+(needle?'<button type="button" class="ck-link" data-needle="'+esc(needle)+'" title="Select the expression in the output">'+esc(m)+"</button>":esc(m))+"</li>");
  });
  (r.diffs||[]).forEach(function(d){
    var when=ckWhen(tz,d.t), needle=fmtZone(tz,d.t)+" "+tz+" = "+isoUTC(d.t), label='<span class="ck-when">'+esc(when)+"</span> — only "+(d.side==="page"?"on this page":"in croniter");
    if(d.side==="page"&&!stale&&outHas(needle)) label='<button type="button" class="ck-link" data-needle="'+esc(needle)+'" title="Select this run in the output">'+label+"</button>";
    items.push('<li class="'+(d.why?"warn":"danger")+'">'+label+'<span class="ck-why">'+esc(d.why?d.why[0]:"No known rule explains this difference.")+"</span></li>");
    if(d.why&&rules.indexOf(d.why[1])<0) rules.push(d.why[1]);
  });
  if(items.length) h+='<ul class="ck-list">'+items.join("")+"</ul>";
  rules.forEach(function(x){ h+='<p class="ck-note"><b>Why:</b> '+esc(x)+"</p>"; });
  (r.notes||[]).forEach(function(n){ if(n) h+='<p class="ck-note">'+esc(n)+"</p>"; });
  if(r.P&&r.C){
    var rows="", n=Math.max(r.P.length,r.C.length), pset={}, cset={};
    r.P.forEach(function(t){ pset[t]=1; }); r.C.forEach(function(t){ cset[t]=1; });
    for(var i=0;i<n;i++){
      var p=r.P[i], c=r.C[i];
      rows+="<tr><td>"+(i+1)+"</td><td"+(p!=null&&!cset[p]&&p<=r.horizon?' class="x"':"")+">"+(p!=null?esc(ckWhen(tz,p)):"—")+"</td><td"+(c!=null&&!pset[c]&&c<=r.horizon?' class="x"':"")+">"+(c!=null?esc(ckWhen(tz,c)):"—")+"</td></tr>";
    }
    h+='<details'+(r.level!=="ok"?" open":"")+'><summary>Both lists side by side ('+esc(tz)+')</summary><div class="ck-tw"><table><thead><tr><th>#</th><th>This page</th><th>croniter</th></tr></thead><tbody>'+rows+"</tbody></table></div></details>";
  }
  h+="</div>";
  box.hidden=false; box.className="ck"+(stale?" stale":""); box.innerHTML=h;
}
function runCheck(){
  if(ck.busy||!state.parsed) return;
  var c=state.parsed, snap={key:ckKey(),c:c,tz:state.tz,now:cache.now,runs:cache.runs.slice()};
  ck.busy=true; renderCheck();
  var body=JSON.stringify({kind:"cron",input:c.expr,extra:{tz:snap.tz,start:new Date(snap.now).toISOString(),count:10}});
  function finish(res){ res.tz=snap.tz; res.expr=c.expr; ck.busy=false; ck.res=res; ck.key=snap.key; renderCheck(); }
  try{
    ckFetch("/api/tools/check",{method:"POST",headers:{"Content-Type":"application/json"},body:body},90000)
      .then(function(r){ return r.text().then(function(t){ var j=null; try{ j=JSON.parse(t); }catch(e){} return {status:r.status,j:j,t:t}; }); })
      .then(function(x){ finish(ckInterpret(x,snap)); },function(e){ finish({level:"danger",head:"The check could not run: "+(e&&e.name==="AbortError"?"no answer in 90 s.":(e&&e.message)||"network error."),notes:[]}); });
  }catch(e){ finish({level:"danger",head:"The check could not run: "+e.message,notes:[]}); }
}
$("ckBtn").addEventListener("click",runCheck);
$("ck").addEventListener("click",function(e){ var b=e.target.closest(".ck-link"); if(b) selectInOut(b.getAttribute("data-needle")); });
if(/^http/.test(location.protocol)&&typeof fetch==="function"){
  try{
    ckFetch("/api/tools/status",{headers:{"Accept":"application/json"}},2500)
      .then(function(r){ return r.ok?r.json():null; })
      .then(function(s){
        if(!s||typeof s!=="object") return;
        ck.build=s.build||"";
        if(s.ready===true&&(s.kinds||[]).indexOf("cron")>=0) ck.ready=true;
        else if(s.ready===false) ck.note="Checks need the tools image: "+(s.build||"");
        renderCheck();
      })["catch"](function(){});
  }catch(e){}
}

/* ---- top ---- */
function renderHead(){
  var c=state.parsed, d=$("desc"), err=$("err");
  $("expr").classList.toggle("bad",!!state.error);
  err.hidden=!state.error; err.textContent=state.error?state.error.message:"";
  if(c){ d.className="desc"; d.textContent=describe(c)+(state.tz==="UTC"?" (UTC)":" ("+state.tz+")"); }
  else { d.className="desc empty"; d.textContent=state.error?"Showing the builder for the last valid expression.":"Type a 5-field cron expression (minute hour day-of-month month day-of-week), pick a template below, or build it field by field."; }
  Array.prototype.forEach.call(document.querySelectorAll("#presets .chip"),function(ch){ ch.classList.toggle("on",!!c&&ch.getAttribute("data-expr")===c.expr&&ch.textContent!=="Example"); });
}
function renderAll(keepBuilder){
  computePreview(); renderHead(); renderStrip(); if(!keepBuilder) renderBuilder(); renderRuns(); renderChecks(); renderOut();
}

$("expr").addEventListener("input",function(e){ customForced=false; builderNote=""; setText(e.target.value,true); });
$("tz").addEventListener("change",function(e){ state.tz=e.target.value; save("tz",state.tz); renderAll(true); });
$("presets").addEventListener("click",function(e){ var b=e.target.closest(".chip"); if(!b) return; customForced=false; builderNote=""; setText(b.getAttribute("data-expr")); });
setInterval(function(){ if(state.parsed){ computePreview(); renderRuns(); } },30000);

$("expr").value=state.text;
setText(state.text,true);
})();
</script>
</body>
</html>
<!--
Cron Studio — usage
- Type a 5-field cron expression at the top (minute hour day-of-month month day-of-week), click a template,
  or pick a field in the strip and build it with Every / Specific / Range / Step / Custom. Both directions stay in sync.
- The time zone selector sets the zone the schedule is read in; runs are listed in that zone with UTC underneath.
- Next 10 runs are computed locally (Vixie cron rules: DOM/DOW OR unless one starts with "*"); DST gaps and repeated hours are marked.
- Checks lists risky patterns; the output panel gives Cron variants (5-field, Quartz/Spring 6-field, EventBridge), a Prompt, and Code.
- Check (only inside the app, when /api/tools is up): asks croniter for the next 10 runs from the same start and zone
  and compares them with this page's list; differences are explained where a DST or day-of-month/day-of-week rule does.
- State is kept in localStorage under "redline.tool.cron-studio.".
-->
