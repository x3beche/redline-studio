<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSS Specificity Calculator</title><link rel="stylesheet" href="../kit/kit.css"><link rel="stylesheet" href="style.css"></head>
<body><noscript>This tool needs JavaScript.</noscript>
<script type="module">const v = location.search.match(/[?&]v=(\w+)/) ? '?v=' + RegExp.$1 : '';for (const l of document.querySelectorAll('link[rel=stylesheet]')) l.href = l.getAttribute('href') + v;import('../kit/kit.js' + v).then((m) => m.mount());</script></body></html>
