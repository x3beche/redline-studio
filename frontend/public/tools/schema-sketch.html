<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schema Sketch — tables and relations to SQL, Prisma and a prompt</title>
<style>
:root{
  --paper:#eef1f4;
  --surface:#ffffff;
  --sunken:#e4e9ee;
  --ink:#16202a;
  --ink-soft:#5b6b7a;
  --line:#c8d2db;
  --line-soft:#dde4ea;
  --accent:#1f4ed8;
  --accent-ink:#ffffff;
  --danger:#c0392b;
  --warn:#b7791f;
  --ok:#2f855a;
  --fill-alpha:0.16;
  --tool-pk:#b7791f;
  --tool-fk:#2b6cb0;
  --tool-nn:#8a5cc2;
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0f151b;
    --surface:#161f27;
    --sunken:#111920;
    --ink:#e4ebf1;
    --ink-soft:#8ea0b0;
    --line:#2b3945;
    --line-soft:#212c36;
    --accent:#6d8dff;
    --accent-ink:#0f151b;
    --danger:#e57373;
    --warn:#e0a84a;
    --ok:#5fbf8a;
    --fill-alpha:0.30;
    --tool-pk:#e0b050;
    --tool-fk:#6fa8ef;
    --tool-nn:#b99af0;
  }
}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0f151b;
  --surface:#161f27;
  --sunken:#111920;
  --ink:#e4ebf1;
  --ink-soft:#8ea0b0;
  --line:#2b3945;
  --line-soft:#212c36;
  --accent:#6d8dff;
  --accent-ink:#0f151b;
  --danger:#e57373;
  --warn:#e0a84a;
  --ok:#5fbf8a;
  --fill-alpha:0.30;
  --tool-pk:#e0b050;
  --tool-fk:#6fa8ef;
  --tool-nn:#b99af0;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}

.bar{
  display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;
  padding:8px 12px;border-bottom:1px solid var(--line);background:var(--surface);flex:none;
}
.brand{font-weight:600;margin:0;font-size:15px}
.brand span{color:var(--ink-soft);font-weight:400}
.actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-left:auto}
.btn{
  padding:4px 10px;border:1px solid var(--line);border-radius:5px;background:var(--surface);
  cursor:pointer;font-size:13px;line-height:1.35;white-space:nowrap;
}
.btn:hover{border-color:var(--ink-soft)}
.btn:disabled{opacity:.5;cursor:default}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-sm{padding:2px 7px;font-size:12px}
.btn-danger{color:var(--danger)}
.btn-danger:hover{border-color:var(--danger)}
.status{font-size:12px;color:var(--ink-soft);min-height:1em}
.status.err{color:var(--danger)}
.status.good{color:var(--ok)}

.wrap{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:10px;padding:10px}
.left{display:flex;flex-direction:column;gap:10px;min-height:0;min-width:0}
.side{display:flex;flex-direction:column;gap:10px;min-height:0;overflow:auto;padding-right:2px}

.viewport{
  position:relative;flex:1 1 55%;min-height:260px;overflow:auto;
  border:1px solid var(--line);border-radius:6px;background-color:var(--sunken);
  background-image:radial-gradient(circle,var(--line) 1px,transparent 1.2px);
  background-size:20px 20px;
}
.board{position:relative;min-width:100%;min-height:100%}
#wires{position:absolute;left:0;top:0;overflow:visible;z-index:0}
#wires path{fill:none}
#wires .w{stroke:var(--ink-soft);stroke-width:1.5}
#wires .w.nn{stroke:var(--tool-nn);stroke-dasharray:5 4}
#wires .w.sel{stroke:var(--accent);stroke-width:2.5}
#wires .m{stroke:var(--ink-soft);stroke-width:1.5}
#wires .m.nn{stroke:var(--tool-nn)}
#wires .m.sel{stroke:var(--accent);stroke-width:2}
#wires circle.m{fill:var(--sunken)}
#wires .hit{stroke:transparent;stroke-width:14;pointer-events:stroke;cursor:pointer}
#wires .wl{font:600 10px "IBM Plex Mono",ui-monospace,monospace;fill:var(--ink-soft);stroke:var(--sunken);stroke-width:4;paint-order:stroke;text-anchor:middle;dominant-baseline:middle;pointer-events:none}
#wires .wl.sel{fill:var(--accent)}
#wires .tmp{stroke:var(--accent);stroke-width:2;stroke-dasharray:4 3}

.tbl{
  position:absolute;width:224px;z-index:1;background:var(--surface);
  border:1px solid var(--line);border-radius:6px;touch-action:none;user-select:none;-webkit-user-select:none;
  box-shadow:0 1px 3px color-mix(in srgb,var(--ink) 12%,transparent);
}
.tbl.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.tbl:focus-visible{outline-offset:2px}
.th{
  display:flex;align-items:center;gap:6px;padding:5px 8px;cursor:grab;
  border-bottom:1px solid var(--line-soft);font-weight:600;font-size:13px;
}
.th .tn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.th .tc{font-weight:400;color:var(--ink-soft);font-size:11px}
.th .tw{color:var(--warn);font-weight:700;font-size:12px}
.tr{position:relative;display:flex;align-items:center;gap:6px;height:22px;padding:0 12px 0 8px;font-size:12px}
.tr + .tr{border-top:1px solid var(--line-soft)}
.tr .kb{flex:none;width:18px;font:600 9px "IBM Plex Mono",ui-monospace,monospace;color:var(--ink-soft)}
.tr .kb.pk{color:var(--tool-pk)}
.tr .kb.fk{color:var(--tool-fk)}
.tr .cn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .ct{flex:none;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;color:var(--ink-soft)}
.tr.none{color:var(--ink-soft);font-style:italic}
.tr.drop{background:color-mix(in srgb,var(--accent) calc(var(--fill-alpha) * 100%),transparent)}
.h{
  position:absolute;right:-7px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;
  background:var(--surface);border:2px solid var(--accent);cursor:crosshair;opacity:.55;
}
.h::before{content:"";position:absolute;inset:-7px}
.tr:hover .h,.tbl.sel .h{opacity:1}
.board-empty{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(340px,90%);
  text-align:center;color:var(--ink-soft);background:var(--surface);border:1px solid var(--line);
  border-radius:6px;padding:14px;z-index:2;
}
.board-empty p{margin:0 0 10px}
.board-empty .row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.board-hint{font-size:12px;color:var(--ink-soft);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;min-width:0}
.card-head{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--line-soft)}
.card-head h2{margin:0;font-size:13px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-body{padding:8px 10px;display:flex;flex-direction:column;gap:7px}
.count{color:var(--ink-soft);font-size:12px;font-family:"IBM Plex Mono",ui-monospace,monospace}
.lbl{font-size:11px;color:var(--ink-soft);display:block;margin-bottom:2px}
.inp,.sel-in,textarea.inp{
  width:100%;min-width:0;padding:3px 6px;border:1px solid var(--line);border-radius:4px;
  background:var(--sunken);font-size:13px;
}
textarea.inp{resize:vertical;min-height:44px;line-height:1.4}
.inp.bad{border-color:var(--danger)}
.msg{font-size:11px;color:var(--danger);min-height:0}
.msg:empty{display:none}
.muted{color:var(--ink-soft);font-size:12px;margin:0}
.cols-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cols-head b{font-size:12px}
.col{border:1px solid var(--line-soft);border-radius:5px;padding:5px;display:flex;flex-direction:column;gap:4px;background:var(--paper)}
.col.is-fk{border-left:3px solid var(--tool-fk)}
.c1{display:flex;gap:4px;align-items:center}
.c1 .inp{flex:1;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px}
.c1 select{width:100px;flex:none;font-size:12px;padding:3px 4px;border:1px solid var(--line);border-radius:4px;background:var(--sunken)}
.ib{border:1px solid transparent;background:transparent;color:var(--ink-soft);cursor:pointer;padding:1px 5px;border-radius:3px;font-size:13px;line-height:1.2;flex:none}
.ib:hover{color:var(--ink);border-color:var(--line)}
.ib.x:hover{color:var(--danger)}
.ib:disabled{opacity:.3;cursor:default}
.c2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:3px;font-size:12px;color:var(--ink-soft);cursor:pointer}
.chk input{margin:0}
.c2 .inp{flex:1;min-width:90px;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px}
.fkline{font-size:11px;color:var(--tool-fk);font-family:"IBM Plex Mono",ui-monospace,monospace}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.rel-title{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;word-break:break-all}
.explain{font-size:12px;color:var(--ink-soft);background:var(--paper);border-radius:4px;padding:6px 8px;margin:0}
.btnrow{display:flex;gap:6px;flex-wrap:wrap}

.list{list-style:none;margin:0;padding:4px;display:flex;flex-direction:column;gap:1px}
.li{
  display:flex;align-items:center;gap:6px;width:100%;text-align:left;padding:4px 6px;border:0;border-radius:4px;
  background:transparent;cursor:pointer;font-size:12px;
}
.li:hover,.li.on{background:var(--sunken)}
.li .mono{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11.5px}
.tag{flex:none;font-size:10.5px;font-family:"IBM Plex Mono",ui-monospace,monospace;color:var(--ink-soft)}
.addrel{display:grid;grid-template-columns:1fr auto 1fr auto;gap:4px;align-items:center;padding:6px 8px 8px;border-top:1px solid var(--line-soft)}
.addrel select{min-width:0;font-size:12px;padding:3px 4px;border:1px solid var(--line);border-radius:4px;background:var(--sunken)}
.issue{display:flex;gap:6px;align-items:flex-start;padding:4px 6px;border-radius:4px;font-size:12px;text-align:left;border:0;background:transparent;width:100%;cursor:pointer}
.issue:hover{background:var(--sunken)}
.issue .sv{flex:none;font:700 10px "IBM Plex Mono",ui-monospace,monospace;padding:1px 4px;border-radius:3px;margin-top:1px}
.issue .sv.error{color:var(--danger);border:1px solid var(--danger)}
.issue .sv.warn{color:var(--warn);border:1px solid var(--warn)}
.okline{color:var(--ok);font-size:12px;margin:0;padding:8px 10px}

.outcard{flex:0 0 42%;min-height:200px;display:flex;flex-direction:column}
.tabs{display:flex;gap:2px;padding:4px 6px 0;flex-wrap:wrap;border-bottom:1px solid var(--line-soft);align-items:flex-end}
.tab{padding:4px 9px;border:0;background:transparent;color:var(--ink-soft);cursor:pointer;font-size:13px;border-bottom:2px solid transparent}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:500}
.tabs .sp{flex:1}
.tabs .foot{display:flex;align-items:center;gap:8px;padding-bottom:4px}
.out{
  flex:1;min-height:0;margin:0;padding:8px 10px;overflow:auto;
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;line-height:1.5;white-space:pre;tab-size:2;
}
.chk-panel{flex:none;max-height:40%;overflow:auto;border-top:1px solid var(--line-soft);padding:6px 10px;font-size:12px;display:flex;flex-direction:column;gap:4px}
.chk-panel[hidden]{display:none}
.chk-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chk-verdict{font-weight:600}
.chk-verdict.pass{color:var(--ok)}
.chk-verdict.fail{color:var(--danger)}
.chk-verdict.busy{color:var(--ink-soft);font-weight:400}
.chk-stale{font:600 10px "IBM Plex Mono",ui-monospace,monospace;color:var(--warn);border:1px solid var(--warn);border-radius:3px;padding:0 4px}
.chk-notes{margin:0;padding:0;list-style:none;color:var(--ink-soft)}
.chk-errs{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px}
.chk-err{display:flex;gap:6px;align-items:flex-start;width:100%;text-align:left;border:0;background:transparent;padding:3px 4px;border-radius:4px;font-size:12px}
button.chk-err{cursor:pointer}
button.chk-err:hover{background:var(--sunken)}
.chk-err .ln{flex:none;font:600 11px "IBM Plex Mono",ui-monospace,monospace;color:var(--danger);min-width:44px}
.chk-err .em{flex:1;min-width:0;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11.5px;white-space:pre-wrap;word-break:break-word}
.chk-panel.stale .chk-verdict,.chk-panel.stale .chk-errs,.chk-panel.stale .chk-notes{opacity:.6}

@media (max-width:900px){
  body{height:auto;display:block}
  .wrap{display:flex;flex-direction:column;padding:8px;gap:8px}
  .left{min-height:0}
  .viewport{flex:none;height:62vh;min-height:320px}
  .outcard{flex:none;height:auto}
  .out{max-height:420px;flex:none}
  .side{overflow:visible;padding-right:0}
}
@media (max-width:480px){
  .bar{padding:6px 8px}
  .actions{margin-left:0}
  .addrel{grid-template-columns:1fr auto;}
  .addrel .arrow{display:none}
}
</style>
</head>
<body>

<header class="bar">
  <h1 class="brand">Schema Sketch <span>— tables and relations to SQL, Prisma and a prompt</span></h1>
  <div class="actions">
    <button class="btn btn-primary" id="addTable" type="button">+ Table</button>
    <button class="btn" id="layout" type="button" title="Arrange tables so none overlap, parents on the left">Auto layout</button>
    <button class="btn" id="example" type="button">Load example</button>
    <button class="btn" id="import" type="button">Import JSON</button>
    <button class="btn" id="export" type="button">Export JSON</button>
    <button class="btn btn-danger" id="clear" type="button">Clear</button>
    <input type="file" id="file" accept=".json,application/json" hidden>
  </div>
</header>

<main class="wrap">
  <section class="left">
    <div class="viewport" id="vp">
      <div class="board" id="board">
        <svg id="wires" aria-hidden="true"></svg>
        <div id="tables"></div>
      </div>
      <div class="board-empty" id="boardEmpty" hidden>
        <p>No tables yet. Add a table, then drag from the <b>●</b> on a column to the column it references.</p>
        <div class="row">
          <button class="btn btn-primary" type="button" data-act="add-table">+ Table</button>
          <button class="btn" type="button" data-act="load-example">Load example</button>
        </div>
      </div>
    </div>
    <div class="board-hint">
      <span>Drag a table by its header. Drag a column’s <b>●</b> onto another column to link (FK → referenced column).</span>
      <span class="status" id="status" role="status" aria-live="polite"></span>
    </div>
    <section class="card outcard" aria-label="Output">
      <div class="tabs" role="tablist" id="tabs">
        <button class="tab" role="tab" type="button" data-fmt="prompt">Prompt</button>
        <button class="tab" role="tab" type="button" data-fmt="sql">SQL</button>
        <button class="tab" role="tab" type="button" data-fmt="prisma">Prisma</button>
        <button class="tab" role="tab" type="button" data-fmt="mermaid">Mermaid</button>
        <button class="tab" role="tab" type="button" data-fmt="json">JSON</button>
        <span class="sp"></span>
        <span class="foot">
          <span class="count" id="chars"></span>
          <span class="status" id="copyMsg" role="status" aria-live="polite"></span>
          <button class="btn btn-sm" id="checkBtn" type="button" hidden title="Run this output in the tools image">Check</button>
          <button class="btn btn-primary btn-sm" id="copy" type="button">Copy</button>
        </span>
      </div>
      <pre class="out" id="out" tabindex="0" aria-label="Generated output"></pre>
      <div class="chk-panel" id="checkPanel" role="status" aria-live="polite" hidden></div>
    </section>
  </section>

  <aside class="side" id="side">
    <section class="card" id="insp"></section>
    <section class="card" id="relcard"></section>
    <section class="card" id="issues"></section>
  </aside>
</main>

<script>
(function(){
'use strict';

/* ============ constants & state ============ */
var LS = 'redline.tool.schema-sketch.';
var TYPES = ['text','integer','bigint','boolean','timestamp','uuid','json','decimal','enum'];
var KINDS = ['1-1','1-N','N-N'];
var ACTIONS = ['cascade','set null','restrict'];
var TW = 224;
var IDENT = /^[A-Za-z_][A-Za-z0-9_]*$/;

var S = { notes:'', tables:[], rels:[] };
var sel = null;            // {k:'t'|'r', id}
var fmt = 'prompt';
var outputs = {};
var seq = 0;

var $ = function(s){ return document.querySelector(s); };
var vp = $('#vp'), board = $('#board'), wires = $('#wires'), tablesEl = $('#tables');

function lsGet(k){ try{ return localStorage.getItem(LS+k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(LS+k,v); }catch(e){} }
function uid(p){ seq++; return p + seq.toString(36) + Math.random().toString(36).slice(2,6); }
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function tById(id){ for(var i=0;i<S.tables.length;i++) if(S.tables[i].id===id) return S.tables[i]; return null; }
function cById(t,id){ if(!t) return null; for(var i=0;i<t.cols.length;i++) if(t.cols[i].id===id) return t.cols[i]; return null; }
function rById(id){ for(var i=0;i<S.rels.length;i++) if(S.rels[i].id===id) return S.rels[i]; return null; }
function refName(end){ var t=tById(end.t), c=cById(t,end.c); return (t?t.name:'?')+'.'+(c?c.name:'?'); }
function enumVals(c){ return String(c.ev||'').split(',').map(function(s){ return s.trim(); }).filter(Boolean); }
function pkCols(t){ return t.cols.filter(function(c){ return c.pk; }); }
function isSel(k,id){ return !!sel && sel.k===k && sel.id===id; }
function status(msg, cls){ var s=$('#status'); s.textContent=msg||''; s.className='status'+(cls?' '+cls:''); }

/* ============ naming helpers ============ */
function singular(w){
  if(/ies$/i.test(w)) return w.slice(0,-3)+'y';
  if(/(ss|us|is)$/i.test(w)) return w;
  if(/(x|ch|sh|ss|z)es$/i.test(w)) return w.slice(0,-2);
  if(/s$/i.test(w) && w.length>1) return w.slice(0,-1);
  return w;
}
function plural(w){
  if(/[^aeiou]y$/i.test(w)) return w.slice(0,-1)+'ies';
  if(/(s|x|z|ch|sh)$/i.test(w)) return w+'es';
  return w+'s';
}
function words(s){ return String(s).replace(/([a-z0-9])([A-Z])/g,'$1 $2').split(/[^A-Za-z0-9]+/).filter(Boolean); }
function pascal(s){ return words(s).map(function(w){ return w.charAt(0).toUpperCase()+w.slice(1).toLowerCase(); }).join(''); }
function camel(s){ var p=pascal(s); return p.charAt(0).toLowerCase()+p.slice(1); }
function uniqueName(base, taken){ var n=base, i=2; while(taken.has(n.toLowerCase())){ n=base+'_'+i; i++; } return n; }

/* ============ analysis shared by validation and generators ============ */
function fkRelOf(cid){ for(var i=0;i<S.rels.length;i++){ var r=S.rels[i]; if(r.kind!=='N-N' && r.from.c===cid) return r; } return null; }
function isOneToOneFk(c){ var r=fkRelOf(c.id); return !!r && r.kind==='1-1'; }
function effUnique(t,c){ var pk=pkCols(t); if(c.pk && pk.length===1) return false; return !!c.unique || isOneToOneFk(c); }
function isUniqueTarget(t,c){ var pk=pkCols(t); return (c.pk && pk.length===1) || !!c.unique; }
function isIdentity(c){ return /^(identity|autoincrement(\(\))?|serial)$/i.test(String(c.def||'').trim()); }
function junctionInfo(t){
  // a table whose primary key is exactly two FK columns = many-to-many junction
  var pk=pkCols(t); if(pk.length!==2) return null;
  var r1=fkRelOf(pk[0].id), r2=fkRelOf(pk[1].id);
  if(!r1||!r2) return null;
  return { a:r1, b:r2 };
}
function indexSuggestions(){
  var out=[];
  S.tables.forEach(function(t){
    var pk=pkCols(t);
    t.cols.forEach(function(c){
      var r=fkRelOf(c.id); if(!r) return;
      if(pk.length && pk[0].id===c.id) return;       // leading PK column already indexed
      if(effUnique(t,c) || (c.pk && pk.length===1)) return;   // unique index exists
      out.push({ t:t, c:c, r:r });
    });
  });
  return out;
}

/* ============ validation ============ */
function validate(){
  var list=[], seen={};
  S.tables.forEach(function(t){
    var k=t.name.toLowerCase();
    if(seen[k]) list.push({sev:'error', t:t.id, msg:'Two tables are named "'+t.name+'". Rename one of them.'});
    seen[k]=1;
    if(!t.cols.length){ list.push({sev:'warn', t:t.id, msg:t.name+' has no columns. Add at least an id column.'}); return; }
    if(!pkCols(t).length) list.push({sev:'warn', t:t.id, msg:t.name+' has no primary key. Tick PK on an id column; Prisma refuses a model without @id or @unique.'});
    var cs={};
    t.cols.forEach(function(c){
      var ck=c.name.toLowerCase();
      if(cs[ck]) list.push({sev:'error', t:t.id, msg:t.name+' has two columns named "'+c.name+'". Rename one.'});
      cs[ck]=1;
      if(c.type==='enum'){
        var v=enumVals(c);
        if(!v.length) list.push({sev:'error', t:t.id, msg:t.name+'.'+c.name+' is an enum with no values. List them comma-separated, e.g. draft, published.'});
        else if(v.some(function(x){ return !/^[A-Za-z][A-Za-z0-9_]*$/.test(x); })) list.push({sev:'warn', t:t.id, msg:t.name+'.'+c.name+' has enum values that are not identifiers; Prisma output maps them with @map.'});
        var d=String(c.def||'').trim().replace(/^'(.*)'$/,'$1');
        if(d && v.length && v.indexOf(d)<0) list.push({sev:'error', t:t.id, msg:'Default "'+d+'" of '+t.name+'.'+c.name+' is not one of its enum values.'});
      }
      if(isIdentity(c) && c.type!=='integer' && c.type!=='bigint') list.push({sev:'error', t:t.id, msg:t.name+'.'+c.name+': identity/autoincrement only works on integer or bigint.'});
    });
  });
  S.rels.forEach(function(r){
    var ft=tById(r.from.t), tt=tById(r.to.t), fc=cById(ft,r.from.c), tc=cById(tt,r.to.c);
    if(!fc||!tc) return;
    var label=refName(r.from)+' → '+refName(r.to);
    if(r.kind==='N-N'){
      list.push({sev:'warn', r:r.id, fix:'junction', msg:'Many-to-many '+ft.name+' ↔ '+tt.name+' has no junction table. SQL cannot express it directly.'});
      if(!(tc.pk && pkCols(tt).length===1) || !(fc.pk && pkCols(ft).length===1))
        list.push({sev:'warn', r:r.id, msg:'Many-to-many '+ft.name+' ↔ '+tt.name+' should link the single-column primary keys of both tables.'});
      return;
    }
    if(!isUniqueTarget(tt,tc))
      list.push({sev:'error', r:r.id, msg:label+': '+tt.name+'.'+tc.name+' is neither the primary key nor unique. PostgreSQL rejects this foreign key; point it at the id or mark the column unique.'});
    if(fc.type!==tc.type || (fc.type==='enum' && fc.ev!==tc.ev))
      list.push({sev:'warn', r:r.id, msg:'Type mismatch '+label+': '+fc.type+' vs '+tc.type+'. Make the FK column '+tc.type+'.'});
    if(r.onDelete==='set null' && (!fc.nullable || fc.pk))
      list.push({sev:'error', r:r.id, msg:label+': on delete "set null" needs '+ft.name+'.'+fc.name+' to be nullable. Tick Null or pick cascade/restrict.'});
  });
  // one FK column pointing at two targets
  var fkc={};
  S.rels.forEach(function(r){ if(r.kind==='N-N') return; if(fkc[r.from.c]) list.push({sev:'warn', r:r.id, msg:refName(r.from)+' is used as a foreign key twice. Keep one relation per FK column.'}); fkc[r.from.c]=1; });
  // cascade cycles: edge parent -> child for every cascading relation
  var adj={};
  S.rels.forEach(function(r){ if(r.kind!=='N-N' && r.onDelete==='cascade'){ (adj[r.to.t]=adj[r.to.t]||[]).push(r); } });
  var reported={};
  S.tables.forEach(function(start){
    var stack=[], onPath={};
    (function dfs(tid){
      onPath[tid]=true;
      (adj[tid]||[]).forEach(function(r){
        var nxt=r.from.t;
        if(nxt===start.id){
          var path=stack.concat([r]);
          var key=path.map(function(x){ return x.id; }).sort().join(',');
          if(!reported[key]){
            reported[key]=1;
            if(path.length===1) list.push({sev:'warn', r:r.id, msg:'Self-referencing cascade on '+refName(r.from)+': deleting one row deletes its whole chain of children. Consider set null or restrict.'});
            else list.push({sev:'warn', r:r.id, msg:'Cascade cycle: '+[start.name].concat(path.map(function(x){ return tById(x.from.t).name; })).join(' → ')+'. One delete can cascade around the loop; make one link restrict or set null.'});
          }
        } else if(!onPath[nxt] && stack.length<S.tables.length){
          stack.push(r); dfs(nxt); stack.pop();
        }
      });
      onPath[tid]=false;
    })(start.id);
  });
  return list;
}

/* ============ SQL (PostgreSQL 16) ============ */
var RESERVED = ('all analyse analyze and any array as asc asymmetric authorization binary both case cast check collate column concurrently constraint create cross current_catalog current_date current_role current_schema current_time current_timestamp current_user default deferrable desc distinct do else end except false fetch for foreign freeze from full grant group having ilike in initially inner intersect into is isnull join lateral leading left like limit localtime localtimestamp natural not notnull null offset on only or order outer overlaps placing primary references returning right select session_user similar some symmetric system_user table tablesample then to trailing true union unique user using variadic verbose when where window with').split(' ');
function qi(n){ return (/^[a-z_][a-z0-9_]*$/.test(n) && RESERVED.indexOf(n)<0) ? n : '"'+String(n).replace(/"/g,'""')+'"'; }
function qs(s){ return "'"+String(s).replace(/'/g,"''")+"'"; }
function cname(s){ return s.length>63 ? s.slice(0,63) : s; }
function enumTypeName(t,c){ return t.name.toLowerCase()+'_'+c.name.toLowerCase(); }
function sqlType(t,c){
  switch(c.type){
    case 'timestamp': return 'timestamptz';
    case 'json': return 'jsonb';
    case 'decimal': return 'numeric(12,2)';
    case 'enum': return qi(enumTypeName(t,c));
    default: return c.type;
  }
}
function isFuncOrKeyword(d){ return /^[A-Za-z_][\w.]*\(.*\)$/.test(d) || /^(current_timestamp|current_date|localtimestamp|null)$/i.test(d); }
function sqlDefault(t,c){
  var d=String(c.def||'').trim();
  if(!d || isIdentity(c)) return '';
  if(isFuncOrKeyword(d)) return d;
  if(/^'.*'$/.test(d)) return d;
  if(c.type==='integer'||c.type==='bigint'||c.type==='decimal') return /^-?\d+(\.\d+)?$/.test(d) ? d : qs(d);
  if(c.type==='boolean') return /^(true|false)$/i.test(d) ? d.toLowerCase() : qs(d);
  if(c.type==='json') return qs(d)+'::jsonb';
  return qs(d);
}
function genSQL(){
  if(!S.tables.length) return '-- No tables yet. Add a table or load the example.\n';
  var L=['-- PostgreSQL 16 DDL generated by Schema Sketch','-- '+S.tables.length+' tables, '+S.rels.filter(function(r){ return r.kind!=='N-N'; }).length+' foreign keys',''];
  var enums=[];
  S.tables.forEach(function(t){ t.cols.forEach(function(c){ if(c.type==='enum') enums.push([t,c]); }); });
  enums.forEach(function(p){
    var v=enumVals(p[1]);
    L.push('CREATE TYPE '+qi(enumTypeName(p[0],p[1]))+' AS ENUM ('+(v.length?v.map(qs).join(', '):"'todo'")+');');
  });
  if(enums.length) L.push('');
  S.tables.forEach(function(t){
    if(t.note) L.push('-- '+t.note.replace(/\s*\n\s*/g,' '));
    var parts=[], pk=pkCols(t);
    t.cols.forEach(function(c){
      var s='  '+qi(c.name)+' '+sqlType(t,c);
      if(isIdentity(c) && (c.type==='integer'||c.type==='bigint')) s+=' GENERATED BY DEFAULT AS IDENTITY';
      else { if(!c.nullable || c.pk) s+=' NOT NULL'; var d=sqlDefault(t,c); if(d) s+=' DEFAULT '+d; }
      parts.push(s);
    });
    if(pk.length) parts.push('  CONSTRAINT '+qi(cname(t.name+'_pkey'))+' PRIMARY KEY ('+pk.map(function(c){ return qi(c.name); }).join(', ')+')');
    t.cols.forEach(function(c){ if(effUnique(t,c)) parts.push('  CONSTRAINT '+qi(cname(t.name+'_'+c.name+'_key'))+' UNIQUE ('+qi(c.name)+')'); });
    if(!parts.length) parts.push('  -- no columns yet');
    L.push('CREATE TABLE '+qi(t.name)+' (');
    L.push(parts.join(',\n'));
    L.push(');','');
  });
  var fks=S.rels.filter(function(r){ return r.kind!=='N-N'; });
  if(fks.length){
    L.push('-- Foreign keys');
    fks.forEach(function(r){
      var ft=tById(r.from.t), tt=tById(r.to.t), fc=cById(ft,r.from.c), tc=cById(tt,r.to.c);
      L.push('ALTER TABLE '+qi(ft.name)+' ADD CONSTRAINT '+qi(cname(ft.name+'_'+fc.name+'_fkey')));
      L.push('  FOREIGN KEY ('+qi(fc.name)+') REFERENCES '+qi(tt.name)+' ('+qi(tc.name)+') ON DELETE '+r.onDelete.toUpperCase()+';');
    });
    L.push('');
  }
  var idx=indexSuggestions();
  if(idx.length){
    L.push('-- Suggested indexes (foreign key columns not already covered by a key)');
    idx.forEach(function(x){ L.push('CREATE INDEX '+qi(cname(x.t.name+'_'+x.c.name+'_idx'))+' ON '+qi(x.t.name)+' ('+qi(x.c.name)+');'); });
    L.push('');
  }
  var notes=S.tables.filter(function(t){ return t.note; });
  if(notes.length){
    notes.forEach(function(t){ L.push('COMMENT ON TABLE '+qi(t.name)+' IS '+qs(t.note)+';'); });
    L.push('');
  }
  S.rels.filter(function(r){ return r.kind==='N-N'; }).forEach(function(r){
    L.push('-- TODO: many-to-many '+tById(r.from.t).name+' <-> '+tById(r.to.t).name+' has no junction table yet.');
  });
  return L.join('\n').replace(/\n+$/,'')+'\n';
}

/* ============ Prisma ============ */
var PRISMA_T = { text:'String', integer:'Int', bigint:'BigInt', boolean:'Boolean', timestamp:'DateTime', uuid:'String', json:'Json', decimal:'Decimal' };
var PRISMA_DB = { uuid:'@db.Uuid', timestamp:'@db.Timestamptz(6)', decimal:'@db.Decimal(12, 2)' };
var PRISMA_ACT = { 'cascade':'Cascade', 'set null':'SetNull', 'restrict':'Restrict' };
function prismaEnumValue(v){ var s=v.replace(/[^A-Za-z0-9_]/g,'_'); if(!/^[A-Za-z]/.test(s)) s='v'+s; return s; }
function prismaDefault(c, enumName){
  var d=String(c.def||'').trim();
  if(!d) return '';
  if(isIdentity(c)) return (c.type==='integer'||c.type==='bigint') ? '@default(autoincrement())' : '';
  if(/^(now\(\)|current_timestamp)$/i.test(d)) return '@default(now())';
  if(isFuncOrKeyword(d)) return /^null$/i.test(d) ? '' : '@default(dbgenerated('+JSON.stringify(d)+'))';
  var lit=d.replace(/^'(.*)'$/,'$1');
  switch(c.type){
    case 'integer': case 'bigint': case 'decimal': return /^-?\d+(\.\d+)?$/.test(lit) ? '@default('+lit+')' : '';
    case 'boolean': return /^(true|false)$/i.test(lit) ? '@default('+lit.toLowerCase()+')' : '';
    case 'enum': return '@default('+prismaEnumValue(lit)+')';
    case 'timestamp': return '@default(dbgenerated('+JSON.stringify(d)+'))';
    default: return '@default('+JSON.stringify(lit)+')';
  }
}
function genPrisma(){
  var head=[
    '// schema.prisma generated by Schema Sketch (PostgreSQL, Prisma 7+).',
    '// The connection URL lives in prisma.config.ts: datasource: { url: env("DATABASE_URL") }.',
    '// Prisma 6 or older: add  url = env("DATABASE_URL")  to the datasource block below.',
    'generator client {',
    '  provider = "prisma-client"',
    '  output   = "../generated/prisma"',
    '}',
    '',
    'datasource db {',
    '  provider = "postgresql"',
    '}'
  ];
  if(!S.tables.length) return head.join('\n')+'\n\n// No tables yet.\n';
  var taken=new Set(), model={}, enumName={}, fields={}, fname={};
  S.tables.forEach(function(t){
    var n=pascal(singular(t.name))||'Model', b=n, i=2;
    while(taken.has(n.toLowerCase())){ n=b+i; i++; }
    taken.add(n.toLowerCase()); model[t.id]=n;
  });
  var enumBlocks=[];
  S.tables.forEach(function(t){ t.cols.forEach(function(c){
    if(c.type!=='enum') return;
    var n=model[t.id]+pascal(c.name), b=n, i=2;
    while(taken.has(n.toLowerCase())){ n=b+i; i++; }
    taken.add(n.toLowerCase()); enumName[c.id]=n;
    var vals=enumVals(c), blk=['enum '+n+' {'];
    (vals.length?vals:['todo']).forEach(function(v){ var p=prismaEnumValue(v); blk.push('  '+p+(p!==v?' @map('+JSON.stringify(v)+')':'')); });
    if(n!==enumTypeName(t,c)) blk.push('','  @@map('+JSON.stringify(enumTypeName(t,c))+')');
    blk.push('}');
    enumBlocks.push(blk.join('\n'));
  }); });
  // scalar fields
  var names={};
  S.tables.forEach(function(t){
    names[t.id]=new Set(); fields[t.id]=[];
    var pk=pkCols(t);
    t.cols.forEach(function(c){
      var n=camel(c.name)||'field', b=n, i=2;
      while(names[t.id].has(n)){ n=b+i; i++; }
      names[t.id].add(n); fname[c.id]=n;
      var type=c.type==='enum' ? enumName[c.id] : PRISMA_T[c.type];
      var attrs=[];
      if(c.pk && pk.length===1) attrs.push('@id');
      if(effUnique(t,c)) attrs.push('@unique');
      var d=prismaDefault(c, enumName[c.id]); if(d) attrs.push(d);
      if(n!==c.name) attrs.push('@map('+JSON.stringify(c.name)+')');
      if(PRISMA_DB[c.type]) attrs.push(PRISMA_DB[c.type]);
      fields[t.id].push([n, type+(c.nullable && !c.pk ? '?' : ''), attrs.join(' ')]);
    });
  });
  function claim(tid, bases){
    for(var i=0;i<bases.length;i++){ if(bases[i] && !names[tid].has(bases[i])){ names[tid].add(bases[i]); return bases[i]; } }
    var b=bases[0]||'rel', n=b+'2', k=3; while(names[tid].has(n)){ n=b+k; k++; }
    names[tid].add(n); return n;
  }
  function pairCount(a,b){ return S.rels.filter(function(r){ return (r.from.t===a&&r.to.t===b)||(r.from.t===b&&r.to.t===a); }).length; }
  S.rels.forEach(function(r){
    var C=tById(r.from.t), P=tById(r.to.t), fc=cById(C,r.from.c), rc=cById(P,r.to.c);
    if(!fc||!rc) return;
    var needName = pairCount(C.id,P.id)>1 || C.id===P.id;
    if(r.kind==='N-N'){
      var rn = needName ? JSON.stringify(model[C.id]+'_'+model[P.id]+'_'+camel(fc.name)) : '';
      var fa=claim(C.id,[camel(plural(singular(P.name)))]), fb=claim(P.id,[camel(plural(singular(C.name)))]);
      fields[C.id].push([fa, model[P.id]+'[]', rn?'@relation('+rn+')':'']);
      fields[P.id].push([fb, model[C.id]+'[]', rn?'@relation('+rn+')':'']);
      return;
    }
    var base=camel(fc.name.replace(/_?id$/i,''));
    if(base===camel(fc.name)) base='';
    var cf=claim(C.id,[base, camel(singular(P.name))]);
    var relName = needName ? JSON.stringify(model[C.id]+'_'+cf) : '';
    var backBases = C.id===P.id ? [cf+(r.kind==='1-1'?'Of':'Children')]
      : needName ? [camel(r.kind==='1-1'?singular(C.name):plural(singular(C.name)))+pascal(cf)]
      : [camel(r.kind==='1-1'?singular(C.name):plural(singular(C.name)))];
    var pf=claim(P.id, backBases);
    fields[C.id].push([cf, model[P.id]+(fc.nullable?'?':''),
      '@relation('+(relName?relName+', ':'')+'fields: ['+fname[fc.id]+'], references: ['+fname[rc.id]+'], onDelete: '+PRISMA_ACT[r.onDelete]+')']);
    fields[P.id].push([pf, model[C.id]+(r.kind==='1-1'?'?':'[]'), relName?'@relation('+relName+')':'']);
  });
  var idx=indexSuggestions(), out=head.slice();
  S.tables.forEach(function(t){
    var f=fields[t.id], w1=0, w2=0;
    f.forEach(function(x){ w1=Math.max(w1,x[0].length); w2=Math.max(w2,x[1].length); });
    var B=[''];
    if(t.note) B.push('/// '+t.note.replace(/\s*\n\s*/g,' '));
    B.push('model '+model[t.id]+' {');
    if(!f.length) B.push('  // no columns yet');
    f.forEach(function(x){ B.push(('  '+pad(x[0],w1)+' '+(x[2]?pad(x[1],w2)+' '+x[2]:x[1])).replace(/\s+$/,'')); });
    var tail=[], pk=pkCols(t);
    if(pk.length>1) tail.push('@@id(['+pk.map(function(c){ return fname[c.id]; }).join(', ')+'])');
    idx.filter(function(x){ return x.t===t; }).forEach(function(x){ tail.push('@@index(['+fname[x.c.id]+'])'); });
    if(model[t.id]!==t.name) tail.push('@@map('+JSON.stringify(t.name)+')');
    if(tail.length){ B.push(''); tail.forEach(function(s){ B.push('  '+s); }); }
    if(!pk.length && !t.cols.some(function(c){ return c.unique; })) B.push('  // WARNING: no primary key; Prisma needs @id, @@id or @unique');
    B.push('}');
    out.push(B.join('\n'));
  });
  if(enumBlocks.length){ out.push(''); out.push(enumBlocks.join('\n\n')); }
  return out.join('\n')+'\n';
}
function pad(s,n){ while(s.length<n) s+=' '; return s; }

/* ============ Mermaid ============ */
function mq(s){ return String(s).replace(/"/g,"'"); }
function genMermaid(){
  if(!S.tables.length) return 'erDiagram\n  %% No tables yet.\n';
  var L=['erDiagram'];
  S.tables.forEach(function(t){
    var ent=t.name.replace(/[^A-Za-z0-9_-]/g,'_');
    L.push('  '+ent+' {');
    t.cols.forEach(function(c){
      var keys=[]; if(c.pk) keys.push('PK'); if(fkRelOf(c.id)) keys.push('FK'); if(effUnique(t,c)) keys.push('UK');
      var note = c.type==='enum' ? enumVals(c).join(' | ') : (c.nullable && !c.pk ? 'nullable' : '');
      L.push('    '+c.type+' '+c.name.replace(/[^A-Za-z0-9_]/g,'_')+(keys.length?' '+keys.join(', '):'')+(note?' "'+mq(note)+'"':''));
    });
    L.push('  }');
  });
  S.rels.forEach(function(r){
    var a=tById(r.from.t).name.replace(/[^A-Za-z0-9_-]/g,'_'), b=tById(r.to.t).name.replace(/[^A-Za-z0-9_-]/g,'_');
    var fc=cById(tById(r.from.t), r.from.c);
    if(r.kind==='N-N') L.push('  '+a+' }o--o{ '+b+' : "many-to-many"');
    else L.push('  '+b+' '+(fc.nullable?'|o':'||')+'--'+(r.kind==='1-1'?'o|':'o{')+' '+a+' : "'+mq(fc.name)+'"');
  });
  return L.join('\n')+'\n';
}

/* ============ Prompt ============ */
var TYPE_WORDS = { text:'text', integer:'integer (32-bit)', bigint:'bigint (64-bit)', boolean:'boolean', timestamp:'timestamp with time zone', uuid:'uuid', json:'jsonb', decimal:'numeric(12,2)', enum:'enum' };
function genPrompt(issues){
  if(!S.tables.length) return 'No tables yet. Add tables (or press "Load example") and the brief for an LLM appears here.\n';
  var fks=S.rels.filter(function(r){ return r.kind!=='N-N'; });
  var junctions=S.tables.map(function(t){ return [t, junctionInfo(t)]; }).filter(function(x){ return x[1]; });
  var L=[];
  L.push('Implement the following relational database schema for PostgreSQL 16. Keep every table name, column name, type, nullability, default and constraint exactly as specified. If something below is contradictory or unsafe, point it out before changing it.');
  L.push('');
  L.push('PURPOSE');
  L.push(S.notes.trim() ? S.notes.trim() : '(not described)');
  L.push('');
  L.push('SUMMARY');
  L.push(S.tables.length+' tables, '+fks.length+' foreign keys'+(junctions.length?', '+junctions.length+' many-to-many link'+(junctions.length>1?'s':'')+' via junction tables':'')+'.');
  L.push('');
  L.push('TABLES');
  S.tables.forEach(function(t,i){
    var pk=pkCols(t);
    L.push('');
    L.push((i+1)+'. '+t.name+(t.note?' — '+t.note.replace(/\s*\n\s*/g,' '):''));
    L.push('   Primary key: '+(pk.length ? pk.map(function(c){ return c.name; }).join(' + ')+(pk.length>1?' (composite)':'') : 'NONE (needs one)'));
    t.cols.forEach(function(c){
      var bits=[c.type==='enum' ? 'enum ('+enumVals(c).join(' | ')+')' : TYPE_WORDS[c.type]];
      bits.push(c.nullable && !c.pk ? 'nullable' : 'not null');
      if(effUnique(t,c)) bits.push('unique');
      if(isIdentity(c)) bits.push('auto-generated identity');
      else if(String(c.def||'').trim()) bits.push('default '+String(c.def).trim());
      var r=fkRelOf(c.id);
      if(r) bits.push('foreign key → '+refName(r.to)+' (on delete '+r.onDelete+')');
      L.push('   - '+c.name+': '+bits.join(', '));
    });
    if(!t.cols.length) L.push('   (no columns defined yet)');
    var refs=S.rels.filter(function(r){ return r.kind!=='N-N' && r.to.t===t.id; }).map(function(r){ return refName(r.from); });
    if(refs.length) L.push('   Referenced by: '+refs.join(', '));
  });
  L.push('');
  L.push('RELATIONSHIPS');
  if(!S.rels.length) L.push('- none');
  S.rels.forEach(function(r){ L.push('- '+relSentence(r)); });
  junctions.forEach(function(x){
    var t=x[0], a=tById(x[1].a.to.t), b=tById(x[1].b.to.t);
    L.push('- Many-to-many: '+a.name+' ↔ '+b.name+' through junction table '+t.name+'. Its composite primary key ('+pkCols(t).map(function(c){ return c.name; }).join(', ')+') prevents duplicate pairs.');
  });
  var idx=indexSuggestions();
  L.push('');
  L.push('INDEXES');
  L.push('- Primary keys and unique columns get their own index.');
  idx.forEach(function(x){ L.push('- Add an index on '+x.t.name+'('+x.c.name+') for foreign key lookups and deletes.'); });
  L.push('');
  L.push('CONVENTIONS');
  L.push('- "timestamp" means timestamptz; "json" means jsonb; "decimal" means numeric(12,2).');
  if(S.tables.some(function(t){ return t.cols.some(function(c){ return c.type==='enum'; }); }))
    L.push('- Enums are native PostgreSQL enum types named <table>_<column>.');
  if(S.tables.some(function(t){ return t.cols.some(isIdentity); }))
    L.push('- "auto-generated identity" means GENERATED BY DEFAULT AS IDENTITY (autoincrement in ORMs).');
  L.push('- Name constraints <table>_pkey, <table>_<column>_key, <table>_<column>_fkey, <table>_<column>_idx.');
  if(issues.length){
    L.push('');
    L.push('OPEN ISSUES (resolve or ask about these first)');
    issues.forEach(function(x){ L.push('- ['+x.sev+'] '+x.msg); });
  }
  L.push('');
  L.push('DELIVERABLE');
  L.push('1. A single PostgreSQL migration: CREATE TYPE for enums, CREATE TABLE for every table, foreign keys with the ON DELETE actions above, and the indexes.');
  L.push('2. Matching ORM models if the project uses an ORM (for Prisma: model names in singular PascalCase with @@map to the table names, fields in camelCase with @map to the column names).');
  L.push('3. A short list of anything you changed or added, with the reason.');

}
function relSentence(r){
  var ft=tById(r.from.t), tt=tById(r.to.t), fc=cById(ft,r.from.c);
  if(r.kind==='N-N') return ft.name+' ↔ '+tt.name+': many-to-many, NOT YET MODELLED. Create a junction table with one foreign key to each side and a composite primary key.';
  var s=refName(r.from)+' → '+refName(r.to)+': ';
  if(r.kind==='1-1') s+='one-to-one (each '+tt.name+' row has at most one '+ft.name+' row; '+ft.name+'.'+fc.name+' is unique)';
  else s+='many-to-one (each '+ft.name+' row belongs to '+(fc.nullable?'zero or one':'exactly one')+' '+tt.name+' row; a '+tt.name+' row can have many '+ft.name+' rows)';
  s+='. On delete of the '+tt.name+' row: ';
  if(r.onDelete==='cascade') s+='CASCADE, its '+ft.name+' rows are deleted too.';
  else if(r.onDelete==='set null') s+='SET NULL, '+ft.name+'.'+fc.name+' becomes NULL.';
  else s+='RESTRICT, the delete is refused while '+ft.name+' rows still point at it.';
  return s;
}

function serialize(){
  return {
    format:'schema-sketch', version:1, notes:S.notes,
    tables:S.tables.map(function(t){
      return { name:t.name, note:t.note||'', x:Math.round(t.x), y:Math.round(t.y),
        columns:t.cols.map(function(c){
          var o={ name:c.name, type:c.type };
          if(c.pk) o.pk=true; if(c.nullable && !c.pk) o.nullable=true; if(c.unique) o.unique=true;
          if(String(c.def||'').trim()) o['default']=String(c.def).trim();
          if(c.type==='enum') o.enumValues=enumVals(c);
          return o;
        }) };
    }),
    relations:S.rels.map(function(r){ return { from:refName(r.from), to:refName(r.to), kind:r.kind, onDelete:r.onDelete }; })
  };
}
function deserialize(o){
  if(!o || typeof o!=='object' || !Array.isArray(o.tables)) throw new Error('not a Schema Sketch file (missing "tables" array).');
  var st={ notes:typeof o.notes==='string'?o.notes:'', tables:[], rels:[] }, byName={};
  o.tables.forEach(function(t,i){
    if(!t || typeof t.name!=='string' || !IDENT.test(t.name)) throw new Error('table #'+(i+1)+' needs a name made of letters, digits and _.');
    if(byName[t.name.toLowerCase()]) throw new Error('two tables are named "'+t.name+'".');
    var nt={ id:uid('t'), name:t.name, note:typeof t.note==='string'?t.note:'', x:+t.x||40+i*40, y:+t.y||40+i*40, cols:[] }, cn={};
    (Array.isArray(t.columns)?t.columns:[]).forEach(function(c,j){
      if(!c || typeof c.name!=='string' || !IDENT.test(c.name)) throw new Error(t.name+': column #'+(j+1)+' needs a name made of letters, digits and _.');
      if(cn[c.name.toLowerCase()]) throw new Error(t.name+' has two columns named "'+c.name+'".');
      if(TYPES.indexOf(c.type)<0) throw new Error(t.name+'.'+c.name+' has unknown type "'+c.type+'". Use one of: '+TYPES.join(', ')+'.');
      var col={ id:uid('c'), name:c.name, type:c.type, pk:!!c.pk, nullable:!!c.nullable && !c.pk, unique:!!c.unique,
        def:c['default']!=null?String(c['default']):'', ev:Array.isArray(c.enumValues)?c.enumValues.join(', '):'' };
      cn[c.name.toLowerCase()]=col; nt.cols.push(col);
    });
    nt._cn=cn; byName[t.name.toLowerCase()]=nt; st.tables.push(nt);
  });
  function end(s, what){
    var m=/^([^.]+)\.(.+)$/.exec(String(s||''));
    var t=m && byName[m[1].toLowerCase()], c=t && t._cn[m[2].toLowerCase()];
    if(!c) throw new Error('relation '+what+' "'+s+'" does not match a table.column.');
    return { t:t.id, c:c.id };
  }
  (Array.isArray(o.relations)?o.relations:[]).forEach(function(r){
    var kind=KINDS.indexOf(r.kind)>=0?r.kind:'1-N', od=ACTIONS.indexOf(r.onDelete)>=0?r.onDelete:'restrict';
    st.rels.push({ id:uid('r'), from:end(r.from,'from'), to:end(r.to,'to'), kind:kind, onDelete:od });
  });
  st.tables.forEach(function(t){ delete t._cn; });
  return st;
}

function newTableName(){ var taken=new Set(S.tables.map(function(t){ return t.name.toLowerCase(); })); return uniqueName('new_table', taken); }

function overlapsAny(x,y,h,skip){
  return S.tables.some(function(t){ if(t===skip) return false; var th=tableH(t);
    return x < t.x+TW+30 && t.x < x+TW+30 && y < t.y+th+30 && t.y < y+h+30; });
}
function addTable(){

    cols:[{ id:uid('c'), name:'id', type:'bigint', pk:true, nullable:false, unique:false, def:'identity', ev:'' }] };

}
function deleteTable(id){

  S.rels=S.rels.filter(function(r){ return r.from.t!==id && r.to.t!==id; });
  S.tables=S.tables.filter(function(x){ return x.id!==id; });

}
function addRelation(from,to){
  if(from.c===to.c){ status('Pick two different columns to link.','err'); return; }
  var ft=tById(from.t), tt=tById(to.t), fc=cById(ft,from.c), tc=cById(tt,to.c);
  if(!fc||!tc) return;
  var bothPk = fc.pk && tc.pk && pkCols(ft).length===1 && pkCols(tt).length===1 && ft!==tt;
  // user dragged from the referenced key to the FK column: flip it
  if(!bothPk && fc.pk && pkCols(ft).length===1 && !tc.pk){ var sw=from; from=to; to=sw; var st=ft; ft=tt; tt=st; var sc=fc; fc=tc; tc=sc; }
  var dup=S.rels.some(function(r){ return (r.from.c===from.c&&r.to.c===to.c)||(r.from.c===to.c&&r.to.c===from.c); });
  if(dup){ status('Those columns are already linked.','err'); return; }
  var r={ id:uid('r'), from:from, to:to, kind: bothPk?'N-N':'1-N', onDelete: fc.nullable?'set null':'restrict' };
  S.rels.push(r); sel={k:'r',id:r.id}; render();
  status(bothPk ? 'Linked two primary keys as many-to-many; create its junction table on the right.' : 'Linked '+refName(r.from)+' → '+refName(r.to)+'.', 'good');
}
function createJunction(rid){
  var r=rById(rid); if(!r) return;
  var A=tById(r.from.t), B=tById(r.to.t), ca=cById(A,r.from.c), cb=cById(B,r.to.c);
  var taken=new Set(S.tables.map(function(t){ return t.name.toLowerCase(); }));
  var name=uniqueName(singular(A.name)+'_'+B.name, taken);
  var n1=singular(A.name)+'_'+ca.name, n2=singular(B.name)+'_'+cb.name;
  if(n1.toLowerCase()===n2.toLowerCase()) n2='related_'+n2;
  var j={ id:uid('t'), name:name, note:'Junction table linking '+A.name+' and '+B.name+'.', x:(A.x+B.x)/2, y:Math.max(A.y+tableH(A),B.y+tableH(B))+40, cols:[
    { id:uid('c'), name:n1, type:ca.type, pk:true, nullable:false, unique:false, def:'', ev:ca.ev },
    { id:uid('c'), name:n2, type:cb.type, pk:true, nullable:false, unique:false, def:'', ev:cb.ev } ] };
  S.tables.push(j);
  S.rels=S.rels.filter(function(x){ return x.id!==rid; });
  S.rels.push({ id:uid('r'), from:{t:j.id,c:j.cols[0].id}, to:{t:A.id,c:ca.id}, kind:'1-N', onDelete:'cascade' });
  S.rels.push({ id:uid('r'), from:{t:j.id,c:j.cols[1].id}, to:{t:B.id,c:cb.id}, kind:'1-N', onDelete:'cascade' });

function autoLayout(){
  var lvl={}, n=S.tables.length;
  S.tables.forEach(function(t){ lvl[t.id]=0; });
  for(var pass=0; pass<n; pass++){
    var changed=false;
    S.rels.forEach(function(r){
      if(r.kind==='N-N' || r.from.t===r.to.t) return;
      if(lvl[r.from.t] < lvl[r.to.t]+1 && lvl[r.to.t]+1 < n){ lvl[r.from.t]=lvl[r.to.t]+1; changed=true; }
    });
    if(!changed) break;
  }
  var colY={};
  S.tables.forEach(function(t){
    var L=lvl[t.id]; var y=colY[L]||30;
    t.x=30+L*(TW+80); t.y=y; colY[L]=y+tableH(t)+36;

  if(e.button!==0) return;

  if(h){
    var row=h.closest('.tr'), p=boardPt(e), a=anchor({t:row.dataset.t,c:row.dataset.col});
    drag={ mode:'link', from:{t:row.dataset.t,c:row.dataset.col}, x0:a.r, y0:a.y, id:e.pointerId };

    tmpWire='<path class="tmp" d="M'+a.r+' '+a.y+'L'+p[0]+' '+p[1]+'"/>'; drawWires();
    return;
  }
  if(hit){ sel={k:'r',id:hit.dataset.r}; render(); return; }
  if(tb){
    var t=tById(tb.dataset.t), pt=boardPt(e);
    drag={ mode:'move', t:t, dx:pt[0]-t.x, dy:pt[1]-t.y, sx:pt[0], sy:pt[1], moved:false, el:tb, id:e.pointerId };
    try{ board.setPointerCapture(e.pointerId); }catch(err){}

  if(drag.mode==='move'){
    if(!drag.moved && Math.abs(p[0]-drag.sx)+Math.abs(p[1]-drag.sy)<4) return;
    drag.moved=true;
    drag.t.x=Math.max(0,Math.round(p[0]-drag.dx)); drag.t.y=Math.max(0,Math.round(p[1]-drag.dy));
    drag.el.style.left=drag.t.x+'px'; drag.el.style.top=drag.t.y+'px';

    tablesEl.querySelectorAll('.tr.drop').forEach(function(x){ x.classList.remove('drop'); });
    var over=document.elementFromPoint(e.clientX,e.clientY), row=over&&over.closest('.tr[data-col]');
    if(row && row.dataset.col!==drag.from.c) row.classList.add('drop');
    tmpWire='<path class="tmp" d="M'+drag.x0+' '+drag.y0+'L'+p[0]+' '+p[1]+'"/>'; drawWires();
  }
});

var CHECK_KIND={ sql:'sql', prisma:'prisma' };

function probeChecks(){
  if(!/^http/.test(location.protocol) || !window.fetch) return;
  var ctl=window.AbortController ? new AbortController() : null;

  try{
    fetch('/api/tools/status', { headers:{ accept:'application/json' }, signal:ctl?ctl.signal:undefined })
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(st){
        if(!st || typeof st!=='object') return;
        checkBuild=typeof st.build==='string' ? st.build : '';
        if(st.ready===true){ checkKinds=Array.isArray(st.kinds) ? st.kinds : []; checkMissing=false; }
        else if(st.ready===false){ checkKinds=[]; checkMissing=true; }
        renderCheck();
      })
      .catch(function(){})
      .then(function(){ clearTimeout(tm); });
  }catch(e){ clearTimeout(tm); }
}

  btn.textContent=checkBusy ? 'Checking…' : 'Check';
  if(!usable){
    if(checkMissing && kind){
      panel.hidden=false; panel.className='chk-panel';
      panel.innerHTML='<p class="muted">Checks need the tools image: <span class="mono">'+esc(checkBuild||'the redline-tools Docker image')+'</span></p>';
    } else { panel.hidden=true; panel.innerHTML=''; }
    return;
  }
  var res=checkRes[fmt];
  if(checkBusy===fmt){
    panel.hidden=false; panel.className='chk-panel';
    panel.innerHTML='<div class="chk-head"><span class="chk-verdict busy">Checking… ('+(kind==='sql'?'running the DDL in PostgreSQL 16':'validating with the Prisma CLI')+')</span></div>';
    return;
  }
  if(!res){ panel.hidden=true; panel.innerHTML=''; return; }
  var stale=res.input!==(outputs[fmt]||''), h='', d=res.data;
  h+='<div class="chk-head">';
  if(res.fail) h+='<span class="chk-verdict fail">✗ '+esc(res.fail)+'</span>';
  else if(d.ok){
    var tb=Array.isArray(d.tables) ? d.tables : null;
    h+='<span class="chk-verdict pass">✓ '+(kind==='sql' ? 'PostgreSQL ran the DDL without errors'+(tb?' · '+tb.length+' table'+(tb.length===1?'':'s')+' created':'') : 'Prisma validated the schema')+'</span>';
  } else {
    var n=(d.errors||[]).length;
    h+='<span class="chk-verdict fail">✗ '+(kind==='sql'?'PostgreSQL rejected the DDL':'Prisma rejected the schema')+(n?' · '+n+' error'+(n===1?'':'s'):'')+'</span>';
  }
  if(stale) h+='<span class="chk-stale" title="The output changed after this check">OUTDATED</span><span class="muted">the output changed; press Check again</span>';
  h+='</div>';
  if(d){
    if(kind==='sql' && Array.isArray(d.tables) && d.tables.length && !d.ok) h+='<p class="muted">Created before the error: <span class="mono">'+esc(d.tables.join(', '))+'</span></p>';
    else if(kind==='sql' && Array.isArray(d.tables) && d.tables.length) h+='<p class="muted">Tables: <span class="mono">'+esc(d.tables.join(', '))+'</span></p>';
    var notes=(Array.isArray(d.notes)?d.notes:[]).filter(function(x){ return typeof x==='string' && x; });
    if(notes.length) h+='<ul class="chk-notes">'+notes.map(function(x){ return '<li>'+esc(x)+'</li>'; }).join('')+'</ul>';
    var errs=Array.isArray(d.errors)?d.errors:[], max=lineCount(res.input);
    if(errs.length){
      h+='<ul class="chk-errs">';
      errs.forEach(function(e){
        var ln=(e && typeof e.line==='number' && e.line>=1) ? e.line : null;
        if(ln && kind==='sql') ln=refineSqlLine(res.input, ln, String(e.message||''));
        var where=ln ? 'line '+ln+(typeof e.column==='number'?':'+e.column:'') : '—';
        var body='<span class="ln">'+esc(where)+'</span><span class="em">'+esc(String(e&&e.message||'error').replace(/\s+$/,''))+'</span>';
        if(ln && ln<=max && !stale) h+='<li><button class="chk-err" type="button" data-line="'+ln+'" title="Select line '+ln+' in the output">'+body+'</button></li>';
        else h+='<li><div class="chk-err">'+body+'</div></li>';
      });
      h+='</ul>';
    }
  }
  panel.hidden=false; panel.className='chk-panel'+(stale?' stale':''); panel.innerHTML=h;
}
// PostgreSQL quotes the failing text as "LINE k: <text>"; the checker's line can land on the
// statement's end, so pick the nearest input line at or before it that contains that text.
function refineSqlLine(input, ln, msg){
  var m=/LINE \d+:\s*(?:\.\.\.)?(.*?)(?:\.\.\.)?\s*$/m.exec(msg); if(!m) return ln;
  var frag=m[1].trim(); if(frag.length<4) return ln;
  var lines=input.split('\n');
  for(var i=Math.min(ln,lines.length)-1;i>=0 && i>=ln-400;i--){ if(lines[i].indexOf(frag)>=0) return i+1; }
  return ln;
}
function selectOutLine(n){
  var pre=$('#out'), node=pre.firstChild; if(!node || node.nodeType!==3) return;
  var txt=node.nodeValue, start=0;
  for(var i=1;i<n;i++){ var j=txt.indexOf('\n',start); if(j<0) return; start=j+1; }
  var end=txt.indexOf('\n',start); if(end<0) end=txt.length;
  var rg=document.createRange(); rg.setStart(node,start); rg.setEnd(node,end);
  pre.focus({preventScroll:true});
  var ws=window.getSelection(); ws.removeAllRanges(); ws.addRange(rg);
  var lh=parseFloat(getComputedStyle(pre).lineHeight)||18;
  pre.scrollTop=Math.max(0,(n-1)*lh-pre.clientHeight/3); pre.scrollLeft=0;
}
function runCheck(){
  var f=fmt, kind=CHECK_KIND[f]; if(!kind || checkBusy || !checkUsable(f)) return;
  var input=outputs[f]||'', btn=$('#checkBtn'), hadFocus=document.activeElement===btn;
  var ctl=window.AbortController ? new AbortController() : null;
  var tm=setTimeout(function(){ if(ctl) ctl.abort(); }, 180000);
  checkBusy=f; renderCheck();
  function finish(res){
    clearTimeout(tm); checkRes[f]=res; checkBusy=null; renderCheck();
    if(hadFocus && (document.activeElement===document.body || !document.activeElement) && !btn.hidden) btn.focus();
  }
  fetch('/api/tools/check', { method:'POST', headers:{ 'content-type':'application/json', accept:'application/json' },
      body:JSON.stringify({ kind:kind, input:input, extra:{} }), signal:ctl?ctl.signal:undefined })
    .then(function(r){ return r.text().then(function(t){ var d=null; try{ d=JSON.parse(t); }catch(e){} return { status:r.status, d:d }; }); })
    .then(function(x){
      var d=x.d;
      if(x.status===503){ checkBuild=(d&&d.build)||checkBuild; finish({ input:input, fail:'Checks need the tools image: '+(checkBuild||'build redline-tools') }); }
      else if(x.status===413) finish({ input:input, fail:'The output is too large for the checker.' });
      else if(x.status===504) finish({ input:input, fail:'The check timed out.' });
      else if(x.status>=400 || !d || typeof d!=='object') finish({ input:input, fail:'Check failed (HTTP '+x.status+')'+(d&&d.detail?': '+(typeof d.detail==='string'?d.detail:JSON.stringify(d.detail)):'.') });
      else finish({ input:input, data:d });
    }, function(err){
      finish({ input:input, fail: err && err.name==='AbortError' ? 'The check timed out.' : 'Could not reach the checker.' });
    });
}
$('#checkBtn').addEventListener('click', runCheck);
$('#checkPanel').addEventListener('click', function(e){
  var b=e.target.closest('[data-line]'); if(b) selectOutLine(+b.dataset.line);
});

/* ============ boot ============ */
var savedTab=lsGet('tab'); if(savedTab && /^(prompt|sql|prisma|mermaid|json)$/.test(savedTab)) fmt=savedTab;
var raw=lsGet('state');
if(raw){
  try{ S=deserialize(JSON.parse(raw)); }
  catch(err){ S={notes:'',tables:[],rels:[]}; status('Saved schema could not be restored ('+err.message+'). Starting empty.','err'); }
}
render();
probeChecks();
// expose generators for headless checks (read-only helpers, harmless in the app)
window.__schemaSketch={ deserialize:deserialize, load:function(o){ S=deserialize(o); sel=null; render(); }, gen:function(){ return { sql:genSQL(), prisma:genPrisma(), mermaid:genMermaid(), prompt:genPrompt(validate()), issues:validate() }; }, example:EXAMPLE };
})();
</script>

<!--
Schema Sketch — usage
- "+ Table" adds a table with a bigint identity id. Rename it and add columns in the right panel
  (name, type, PK, Null, Unique, default; enum columns take comma-separated values).
- Link tables by dragging the dot at the right end of a foreign-key column onto the column it
  references (usually the other table's id), or with the From → To selects under Relations.
  Linking two primary keys creates a many-to-many; "Create junction table" turns it into a
  junction table with a composite key and two cascading foreign keys.
- Select a relation (click its line or its row) to set 1-1 / 1-N / N-N and on-delete behaviour.
- Issues lists missing primary keys, duplicate names, FK type mismatches, bad FK targets,
  set-null on NOT NULL columns and cascade cycles. Click an issue to jump to it.
- Output tabs: Prompt (brief for an LLM), SQL (PostgreSQL 16 DDL), Prisma, Mermaid erDiagram, JSON.
  JSON is the same format Import/Export JSON uses. State is kept in localStorage
  under redline.tool.schema-sketch.*.
-->
